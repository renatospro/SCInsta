name: Build playback and local controls
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test independent controls and selected Reel preservation
        run: |
          xcrun clang -fobjc-arc -O2 -Wall -Wextra -Werror -Wno-unused-parameter \
            -framework Foundation reels-only/tests.m -o "$RUNNER_TEMP/reels-tests"
          "$RUNNER_TEMP/reels-tests"
          xcrun clang -fobjc-arc -O2 -Wall -Wextra -Werror -Wno-unused-parameter -DRB_NEW_API=1 \
            -framework Foundation reels-only/tests.m -o "$RUNNER_TEMP/reels-tests-451"
          "$RUNNER_TEMP/reels-tests-451"
      - name: Compile blocker and UIKit settings
        run: |
          mkdir -p packages
          xcrun --sdk iphoneos clang -target arm64-apple-ios16.3 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -dynamiclib -fobjc-arc -O2 -Wall -Wextra -Werror -Wno-unused-parameter \
            -framework Foundation -framework UIKit \
            -install_name @rpath/ReelsBlocker.dylib \
            reels-only/ReelsBlocker.m -o packages/ReelsBlocker.dylib
          otool -L packages/ReelsBlocker.dylib
          shasum -a 256 packages/ReelsBlocker.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: ReelsBlocker-v2-source-build
          path: packages/ReelsBlocker.dylib
          if-no-files-found: error
